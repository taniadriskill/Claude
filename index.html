<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>States & Capitals Flip Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: white;
            margin-bottom: 40px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .flip-card-container {
            perspective: 1000px;
            margin-bottom: 30px;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 250px;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        .flip-card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform: rotateY(180deg);
        }

        .label {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .content {
            font-size: 2.5em;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .flip-btn {
            background: white;
            color: #667eea;
        }

        .flip-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .flip-btn:active {
            transform: translateY(0);
        }

        .next-btn {
            background: #f5576c;
            color: white;
        }

        .next-btn:hover {
            background: #f43556;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .next-btn:active {
            transform: translateY(0);
        }

        .counter {
            color: white;
            margin-top: 20px;
            font-size: 1em;
            opacity: 0.9;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8em;
            }

            .flip-card-front,
            .flip-card-back {
                height: 200px;
            }

            .content {
                font-size: 1.8em;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗽 States & Capitals</h1>

        <div class="flip-card-container">
            <div class="flip-card" id="flipCard">
                <div class="flip-card-front">
                    <div class="label">STATE</div>
                    <div class="content" id="stateDisplay">Alabama</div>
                </div>
                <div class="flip-card-back">
                    <div class="label">CAPITAL</div>
                    <div class="content" id="capitalDisplay">Montgomery</div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="flip-btn" id="flipBtn">Flip Card</button>
            <button class="next-btn" id="nextBtn">Next State →</button>
        </div>

        <div class="counter">
            <span id="counter">1</span> / <span id="total">50</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
